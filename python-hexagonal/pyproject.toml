[project]
name = "app"
version = "0.1.0"
description = "A Python project — hexagonal architecture template"
readme = "README.md"
requires-python = ">=3.12"

# The core install carries only what every run needs. Everything that belongs to a
# single adapter is an extra below, so installing the project never drags in a backend
# you do not use.
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.12.0",
]

# One extra per optional adapter. `uv sync --extra jsonfile` adds the JSON-file backend;
# without it, that adapter's import fails loudly at startup naming the extra to install.
[project.optional-dependencies]
jsonfile = ["orjson>=3.10.0"]
all = ["orjson>=3.10.0"]

# The entrypoint lives in the composition root: starting the app means building its
# object graph, which is the one thing presentation is not allowed to do.
[project.scripts]
app = "app.composition.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
    "bandit[toml]>=1.7.10",
    "pre-commit>=4.0.0",
]

# --- The dependency rule, machine-checked. An unenforced architecture decays. --------
#
# domain         -> nothing (not even a third-party runtime dependency)
# application    -> domain
# infrastructure -> application, domain
# presentation   -> application, domain          (NOT infrastructure)
# composition    -> everything; the only place that may, and not a layer.
#
# `presentation` and `infrastructure` are independent siblings: neither may import the
# other. That is what forces adapter selection out of the presentation modules and into
# the composition root, so a presentation module can never name a concrete adapter.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain depends on nothing"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.application",
    "app.infrastructure",
    "app.presentation",
    "app.composition",
]

[[tool.importlinter.contracts]]
name = "Application depends only on domain"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "app.infrastructure",
    "app.presentation",
    "app.composition",
]

[[tool.importlinter.contracts]]
name = "Infrastructure depends only on application and domain"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = [
    "app.presentation",
    "app.composition",
]

[[tool.importlinter.contracts]]
name = "Presentation depends only on application and domain"
type = "forbidden"
source_modules = ["app.presentation"]
forbidden_modules = [
    "app.infrastructure",
    "app.composition",
]

[[tool.importlinter.contracts]]
name = "Domain is pure Python"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["pydantic", "pydantic_settings", "orjson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `from tests.fakes import ...` resolves. The package itself is installed, not imported
# from the tree — that is the point of the src/ layout.
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "unit: offline tests; no network, no real backend",
    "integration: exercises a real boundary; skipped when prerequisites are absent",
]

[tool.coverage.run]
branch = true
source = ["src/app"]

[tool.coverage.report]
# The gate covers the domain and application layers only — the code with logic worth
# protecting. Adapters are thin wrappers whose value is in an integration suite; holding
# them to the same bar would only buy us mocks of third-party clients.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG"]  # asserts and unused fixture args are fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Optional-extra packages are absent from a core or dev install, so mypy cannot import
# them. Their adapters are exercised by the integration suite, which installs the extra.
[[tool.mypy.overrides]]
module = ["orjson.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]
