repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: debug-statements
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [-b, main]

  # ruff runs from the dev environment; bump it with `uv lock --upgrade-package ruff`.
  # --force-exclude makes it honour pyproject.toml's excludes when handed explicit paths,
  # and it parallelises internally, hence require_serial.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, autofix)
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: import-linter (layer dependency rule)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
